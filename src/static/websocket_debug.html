<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket 診斷工具</title>
    <style>
        body { font-family: sans-serif; line-height: 1.6; padding: 20px; background-color: #f4f4f4; color: #333; }
        #status { font-size: 1.5em; font-weight: bold; padding: 10px; border-radius: 5px; }
        .connecting { color: #f0ad4e; background-color: #fcf8e3; }
        .open { color: #5cb85c; background-color: #dff0d8; }
        .closed { color: #d9534f; background-color: #f2dede; }
        #log-container { margin-top: 20px; background-color: #fff; border: 1px solid #ccc; padding: 15px; border-radius: 5px; max-height: 500px; overflow-y: auto; }
        .log-entry { padding: 5px; border-bottom: 1px solid #eee; }
        .log-entry:last-child { border-bottom: none; }
        .log-type { font-weight: bold; }
        .log-data { white-space: pre-wrap; word-wrap: break-word; background-color: #efefef; padding: 5px; border-radius: 3px; margin-top: 5px; }
    </style>
</head>
<body>
    <h1>WebSocket 診斷工具</h1>
    <p>這個頁面會嘗試連接到 <code>/ws/status</code> 端點，並記錄所有事件。</p>

    <h2>連線狀態:</h2>
    <div id="status" class="connecting">正在連線中...</div>

    <h2>事件日誌:</h2>
    <div id="log-container"></div>

    <div id="interactive-test" style="margin-top: 20px;">
        <h2>互動式 Ping 測試</h2>
        <input type="text" id="ping-message" placeholder="輸入要發送的訊息..." style="padding: 10px; width: 300px; border-radius: 5px; border: 1px solid #ccc;">
        <button id="send-ping" style="padding: 10px 15px; border-radius: 5px; border: none; background-color: #5cb85c; color: white; cursor: pointer;">發送 Ping</button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const statusDiv = document.getElementById('status');
            const logContainer = document.getElementById('log-container');
            const pingMessageInput = document.getElementById('ping-message');
            const sendPingButton = document.getElementById('send-ping');

            let socket; // 將 socket 提升為更高範圍的變數

            function logEvent(type, data) {
                const timestamp = new Date().toISOString();
                // Log to browser console
                console.log(`[${timestamp}] - ${type}`, data);

                // Log to page
                const entry = document.createElement('div');
                entry.className = 'log-entry';

                const typeSpan = document.createElement('span');
                typeSpan.className = 'log-type';
                typeSpan.textContent = `[${type}] at ${timestamp}`;

                entry.appendChild(typeSpan);

                if (data) {
                    const dataPre = document.createElement('pre');
                    dataPre.className = 'log-data';
                    dataPre.textContent = typeof data === 'object' ? JSON.stringify(data, null, 2) : data;
                    entry.appendChild(dataPre);
                }

                logContainer.appendChild(entry);
                logContainer.scrollTop = logContainer.scrollHeight;
            }

            const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${wsProtocol}//${window.location.host}/ws/status`;

            logEvent('Attempting to connect', { url: wsUrl });

            socket = new WebSocket(wsUrl); // 賦值給更高範圍的 socket 變數

            sendPingButton.onclick = function() {
                if (socket && socket.readyState === WebSocket.OPEN) {
                    const message = pingMessageInput.value || '預設 Ping 訊息';
                    const request = {
                        type: 'ECHO_REQUEST',
                        payload: { message: message }
                    };
                    socket.send(JSON.stringify(request));
                    logEvent('Ping Sent', request);
                    pingMessageInput.value = '';
                } else {
                    logEvent('Ping Error', 'WebSocket 未連接。');
                }
            };

            socket.onopen = function(event) {
                statusDiv.textContent = '連線成功 (OPEN)';
                statusDiv.className = 'open';
                logEvent('onopen', { readyState: socket.readyState });
            };

            socket.onmessage = function(event) {
                let data = event.data;
                try {
                    // Try to parse as JSON for better logging
                    data = JSON.parse(data);
                } catch (e) {
                    // Keep as string if not JSON
                }
                logEvent('onmessage', data);
            };

            socket.onerror = function(event) {
                statusDiv.textContent = '連線發生錯誤 (ERROR)';
                statusDiv.className = 'closed';
                // The event object for onerror is often not very descriptive,
                // but we log what we can.
                logEvent('onerror', '一個錯誤發生了。請檢查瀏覽器主控台以獲取更多資訊。');
            };

            socket.onclose = function(event) {
                statusDiv.textContent = `連線已關閉 (CLOSED) - Code: ${event.code}, Reason: "${event.reason || '無'}"`;
                statusDiv.className = 'closed';
                logEvent('onclose', {
                    code: event.code,
                    reason: event.reason,
                    wasClean: event.wasClean
                });
            };
        });
    </script>
</body>
</html>
