<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>善狼啟動器 - 正在初始化...</title>
    <script src="https://cdn.jsdelivr.net/npm/ansi_up@5.1.0/ansi_up.min.js"></script>
    <style>
        body { background-color: #1a1a1a; color: #e0e0e0; font-family: 'SF Mono', 'Consolas', 'Menlo', monospace; font-size: 14px; margin: 0; padding: 20px; overflow-y: scroll; }
        #log-container {
            white-space: pre;
            font-size: 13px;
            line-height: 1.5;
            min-height: 50px; /* 確保容器即使為空也可見 */
            padding: 10px;
            border: 1px solid #333;
            border-radius: 5px;
            background-color: #000; /* 給予背景色以突出顯示 */
        }
        #title-container { display: flex; align-items: center; border-bottom: 1px solid #444; padding-bottom: 10px; }
        #spinner { margin-left: 12px; font-size: 16px; }
        .line { display: block; }
    </style>
</head>
<body>
    <div id="title-container">
        <h1 style="margin: 0; font-size: 18px;">🐺 善狼啟動器 - 正在準備環境...</h1>
        <div id="spinner">|</div>
    </div>
    <pre id="log-container"><div class="line" style="color: #f39c12;">[SYSTEM] 正在初始化啟動頁面，請稍候...</div></pre>
    <script>
        const logContainer = document.getElementById('log-container');
        const spinner = document.getElementById('spinner');
        const ansi_up = new AnsiUp();
        const spinnerChars = ['|', '/', '-', '\\\\'];
        let spinnerIndex = 0;

        const spinnerInterval = setInterval(() => {
            spinner.textContent = spinnerChars[spinnerIndex];
            spinnerIndex = (spinnerIndex + 1) % spinnerChars.length;
        }, 200);

        const evtSource = new EventSource('/events');
        let isFirstMessage = true;

        evtSource.onmessage = function(event) {
            try {
                const data = JSON.parse(event.data);

                // 檢查是否有特殊狀態信號
                if (data.status === 'ready') {
                    evtSource.close();
                    clearInterval(spinnerInterval);
                    spinner.textContent = '🚀';
                    const div = document.createElement('div');
                    div.innerHTML = ansi_up.ansi_to_html('\\n\\n\\033[1;32m[SYSTEM] 主應用程式已就緒！準備跳轉...\\033[0m');
                    logContainer.appendChild(div);
                    window.scrollTo(0, document.body.scrollHeight);
                    // 稍作等待，確保伺服器完全就緒，然後重新載入
                    setTimeout(() => { window.location.reload(); }, 750);
                    return;
                }

                if (isFirstMessage) {
                    logContainer.innerHTML = ''; // 收到第一條真實日誌時，清除初始訊息
                    isFirstMessage = false;
                }

                if (data.log) {
                    const div = document.createElement('div');
                    div.className = 'line';
                    div.innerHTML = ansi_up.ansi_to_html(data.log);
                    logContainer.appendChild(div);
                    window.scrollTo(0, document.body.scrollHeight);
                }
            } catch (e) {
                // 忽略解析錯誤，因為心跳訊息不是 JSON
            }
        };

        evtSource.onerror = function(err) {
            evtSource.close();
            clearInterval(spinnerInterval);
            spinner.textContent = '❌';
            const div = document.createElement('div');
            div.innerHTML = ansi_up.ansi_to_html('\\n\\n\\033[1;31m[CRITICAL] 與後端的連接已中斷。主應用程式可能啟動失敗或已崩潰。請檢查 Colab 主控台的日誌輸出以獲取詳細資訊。頁面將不會自動重整。\\033[0m');
            logContainer.appendChild(div);
            window.scrollTo(0, document.body.scrollHeight);
        };
    </script>
</body>
</html>
